name: Daily market snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily.yml"
      - "src/fetch_public_rankings.py"
      - "src/fetch_fanqie_short.py"
      - "src/fetch_zhihu_story_ranking.py"
      - "src/fetch_wechat.py"
      - "src/fetch_sites.py"
  schedule:
    # Twice daily: 09:30 and 17:30 Asia/Shanghai (01:30 and 09:30 UTC).
    - cron: "30 1,9 * * *"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and write snapshot
        continue-on-error: true
        run: python src/fetch_wechat.py --sources sources.json --output data --market-output market-intel

      - name: Fetch official novel site ranking metadata
        if: always()
        continue-on-error: true
        run: python src/fetch_sites.py --sources sources.sites.json --output data/site_rankings

      - name: Fetch dated public female new-book rankings
        if: always()
        run: python src/fetch_public_rankings.py --output-root market-intel

      - name: Fetch dated Fanqie short-story ranking
        if: always()
        continue-on-error: true
        run: python src/fetch_fanqie_short.py

      - name: Fetch official Zhihu story ranking metadata
        if: always()
        continue-on-error: true
        run: python src/fetch_zhihu_story_ranking.py --output-root market-intel

      - name: Commit changed snapshots and honest crawl errors
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.md data/latest.json data/archive data/site_rankings market-intel
          git diff --cached --quiet || git commit -m "chore: update daily WeChat market snapshot"
          git push
